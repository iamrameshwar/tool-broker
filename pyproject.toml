[project]
name = "toolbroker"
version = "0.1.0.dev0"
description = "Broker the right 5 tools out of 500 to your agent, on any framework, with rules you control."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# NOTICE ships with the package: Apache-2.0 §4(d) requires derivative works
# to carry it, so it has to be in the wheel, not only in the repo.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rameshwar Trivedi" }]
keywords = ["llm", "agents", "mcp", "tools", "retrieval", "tool-selection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Core stays dependency-light on purpose: pydantic for validated models, nothing else.
# Everything heavier (embedding models, vector servers, frameworks) is an extra or a plugin.
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
fastembed = ["fastembed>=0.3"]
numpy = ["numpy>=1.24"]
mcp = ["mcp>=2,<3"]
yaml = ["pyyaml>=6"]
otel = ["opentelemetry-api>=1.24"]
# For plugin authors running toolbroker.testing conformance suites.
test = ["pytest>=8"]
docs = ["mkdocs-material>=9.5"]
# Framework adapters live in their own packages so a framework's breaking
# change forces a release of that adapter, not of the core. These extras
# stay as convenience aliases.
langgraph = ["toolbroker-langgraph"]
openai-agents = ["toolbroker-openai-agents"]
claude-agent = ["toolbroker-claude-agent"]
ollama = ["toolbroker-ollama"]
openai-embed = ["toolbroker-openai-embed"]
crewai = ["toolbroker-crewai"]
pgvector = ["toolbroker-pgvector"]
all = ["toolbroker[fastembed,numpy,mcp,yaml,otel,langgraph,openai-agents,claude-agent,ollama,openai-embed]"]

[project.scripts]
toolbroker = "toolbroker.cli.main:main"

[project.urls]
Homepage = "https://github.com/iamrameshwar/tool-broker"
Documentation = "https://github.com/iamrameshwar/tool-broker#readme"
Issues = "https://github.com/iamrameshwar/tool-broker/issues"

# --- Built-in components register through the same entry-point mechanism that
# --- third-party plugins use. If it works for us, it works for contributors.
[project.entry-points."toolbroker.embedders"]
hashing = "toolbroker.index.embedders.hashing:HashingEmbedder"
fastembed = "toolbroker.index.embedders.fastembed:FastEmbedEmbedder"

[project.entry-points."toolbroker.stores"]
memory = "toolbroker.store.memory:InMemoryStore"

[project.entry-points."toolbroker.retrievers"]
semantic = "toolbroker.retrieve.semantic:SemanticRetriever"
keyword = "toolbroker.retrieve.keyword:KeywordRetriever"
hybrid = "toolbroker.retrieve.hybrid:HybridRetriever"

[project.entry-points."toolbroker.rerankers"]
usage = "toolbroker.retrieve.rerank:UsageBooster"
llm = "toolbroker.retrieve.rerank:LLMReranker"

[project.entry-points."toolbroker.tracers"]
otel = "toolbroker.observability.tracing:OTelTracer"
null = "toolbroker.observability.tracing:NullTracer"

[project.entry-points."toolbroker.adapters"]
openai = "toolbroker.adapters.raw:OpenAIAdapter"
anthropic = "toolbroker.adapters.raw:AnthropicAdapter"

[project.entry-points."toolbroker.sources"]
python = "toolbroker.sources.python_fn:PythonFunctionSource"
json = "toolbroker.sources.static_json:StaticJSONSource"
mcp = "toolbroker.sources.mcp:MCPSource"
openapi = "toolbroker.sources.openapi:OpenAPISource"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbroker"]

# --- Monorepo -------------------------------------------------------------
# Plugin packages are workspace members so `uv sync` installs them editable and
# CI runs their conformance suites against the core in the same tree. Each one
# is independently publishable; none of them is a dependency of the core.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
toolbroker = { workspace = true }
toolbroker-langgraph = { workspace = true }
toolbroker-openai-agents = { workspace = true }
toolbroker-claude-agent = { workspace = true }
toolbroker-ollama = { workspace = true }
toolbroker-openai-embed = { workspace = true }
toolbroker-crewai = { workspace = true }
toolbroker-pgvector = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "ANN", "D"]
ignore = [
    "D100", "D104",  # module/package docstrings are enforced by review, not lint
    "ANN401",        # Any is legitimate at adapter boundaries
    "D203", "D213",  # mutually exclusive with the styles we do use
    "TID252",        # intra-package relative imports are deliberate: the core
                     # must stay renameable and vendorable without rewrites
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]
"packages/*/tests/**" = ["D", "ANN", "S101"]
"bench/**" = ["D", "ANN"]
"examples/**" = ["D", "ANN", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# 3.12 rather than our 3.10 floor: numpy's bundled stubs use 3.12-only syntax
# and cannot be parsed below it. The 3.10 floor is verified by CI running the
# test suite on 3.10, and by ruff's py310 target.
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src/toolbroker", "packages/*/src"]
# Plugin test modules share basenames across packages by design; pytest handles
# that with importlib mode, mypy cannot, and type-checking them adds nothing.
exclude = ["packages/[^/]+/tests/"]

[[tool.mypy.overrides]]
module = [
    "fastembed.*",
    "mcp.*",
    "langchain_core.*",
    "opentelemetry.*",
    "yaml.*",
    "chromadb.*",
]
ignore_missing_imports = true

# numpy's bundled stubs use 3.12-only syntax, which trips checking at our
# 3.10 floor. We only touch numpy through a thin, tested shim in _vectors.
[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
# importlib import mode so plugin packages can each have a tests/test_store.py
# without colliding on module name.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires external processes or network",
    "conformance: adapter/store contract suite",
]

[tool.coverage.run]
source = ["src/toolbroker"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
