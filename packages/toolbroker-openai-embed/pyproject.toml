[project]
name = "toolbroker-openai-embed"
version = "0.1.0.dev0"
description = "OpenAI and Azure OpenAI embeddings for ToolBroker."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Rameshwar Trivedi" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Typing :: Typed",
]
dependencies = ["toolbroker>=0.1.0.dev0", "openai>=1.30"]

[project.entry-points."toolbroker.embedders"]
openai = "toolbroker_openai_embed:OpenAIEmbedder"
azure-openai = "toolbroker_openai_embed:AzureOpenAIEmbedder"

[project.urls]
Homepage = "https://github.com/iamrameshwar/tool-broker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbroker_openai_embed"]
