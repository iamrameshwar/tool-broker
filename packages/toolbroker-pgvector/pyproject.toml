[project]
name = "toolbroker-pgvector"
version = "0.1.0.dev0"
description = "PostgreSQL/pgvector store for ToolBroker."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Rameshwar Trivedi" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Typing :: Typed",
]
dependencies = ["toolbroker>=0.1.0.dev0", "psycopg[binary]>=3.1", "pgvector>=0.2"]

[project.entry-points."toolbroker.stores"]
pgvector = "toolbroker_pgvector:PgVectorStore"

[project.urls]
Homepage = "https://github.com/iamrameshwar/tool-broker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbroker_pgvector"]
