[project]
name = "toolbroker-crewai"
version = "0.1.0"
description = "CrewAI adapter for ToolBroker."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Rameshwar Trivedi" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Typing :: Typed",
]
dependencies = ["toolbroker>=0.1.0", "crewai>=0.80"]

[project.entry-points."toolbroker.adapters"]
crewai = "toolbroker_crewai:CrewAIAdapter"

[project.urls]
Homepage = "https://github.com/iamrameshwar/tool-broker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbroker_crewai"]
