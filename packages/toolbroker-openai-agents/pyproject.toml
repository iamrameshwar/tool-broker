[project]
name = "toolbroker-openai-agents"
version = "0.1.0.dev0"
description = "OpenAI Agents SDK adapter for ToolBroker."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Rameshwar Trivedi" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Typing :: Typed",
]
dependencies = ["toolbroker>=0.1.0.dev0", "openai-agents>=0.1"]

[project.entry-points."toolbroker.adapters"]
openai-agents = "toolbroker_openai_agents:OpenAIAgentsAdapter"

[project.urls]
Homepage = "https://github.com/iamrameshwar/tool-broker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbroker_openai_agents"]
