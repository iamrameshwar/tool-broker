name: publish

# Releases are cut by pushing a tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# There are no API tokens anywhere in this repo. PyPI's Trusted Publishing
# mints a short-lived credential from GitHub's OIDC identity, scoped to this
# workflow file in this repository, so a leaked secret is not a thing that can
# happen — there is no secret. Setup is one "pending publisher" entry per
# package on PyPI; see docs/releasing.md.
#
# `workflow_dispatch` publishes to TestPyPI instead, which is how you find out
# your metadata is wrong without burning a version number on the real index.
#
# Trusted publishing is the default and the better option: nothing secret lives
# in this repo. If the OIDC claims cannot be made to match, set the repository
# secrets `PYPI_API_TOKEN` and `TEST_PYPI_API_TOKEN` and the jobs below use
# those instead — same result, one secret to guard and rotate.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate. A release that fails its own test suite is worse than no release,
  # and PyPI versions cannot be reused once published.
  verify:
    name: tests must pass before anything is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - run: uv run ruff check .
      - run: uv run --with mypy mypy
      - run: uv run pytest -q
      - run: uv run pytest packages -q

      - name: the tag must match the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run python - <<'PY'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert tag == version, (
              f"tag v{tag} does not match pyproject version {version}. "
              "A mismatch here publishes something nobody can find by its tag."
          )
          print(f"tag and version agree: {version}")
          PY

      - name: every package must share the core's version
        run: |
          uv run python - <<'PY'
          import pathlib, tomllib
          core = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          drift = {
              str(path.parent.name): tomllib.load(open(path, "rb"))["project"]["version"]
              for path in pathlib.Path("packages").glob("*/pyproject.toml")
              if tomllib.load(open(path, "rb"))["project"]["version"] != core
          }
          assert not drift, f"version drift against core {core}: {drift}"
          print(f"all packages at {core}")
          PY

  build:
    name: build all distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --all-packages --out-dir dist
      - name: check the metadata PyPI will reject at upload time
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/

  # Core goes first and alone. Every plugin declares `toolbroker>=...`, so a
  # plugin on the index before the core it needs is a broken install for anyone
  # quick enough to hit the gap.
  publish-core:
    name: publish toolbroker
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist/
      - name: keep only the core distribution
        run: |
          mkdir -p core
          mv dist/toolbroker-*.whl dist/toolbroker-*.tar.gz core/
          rm -rf dist && mv core dist
          ls dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty means "use trusted publishing"; a value takes precedence.
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-plugins:
    name: publish the plugin packages
    needs: publish-core
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist/
      - name: drop the core, which is already published
        run: |
          rm -f dist/toolbroker-0*.whl dist/toolbroker-0*.tar.gz
          ls dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Manual runs go here instead. TestPyPI lets a bad description or a wrong
  # classifier fail somewhere that does not permanently consume a version.
  #
  # Core only, deliberately. What a dry run has to prove is that the trusted
  # publisher handshake works and that the metadata survives an upload — one
  # package establishes both. Publishing all ten would demand ten more pending
  # publishers on TestPyPI to rehearse something the real index will do anyway.
  publish-testpypi:
    name: dry run to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist/
      - name: keep only the core distribution
        run: |
          mkdir -p core
          mv dist/toolbroker-0*.whl dist/toolbroker-0*.tar.gz core/
          rm -rf dist && mv core dist
          ls dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
